name: Atualizar e publicar

on:
  schedule:
    - cron: "47 18 * * *"   # todo dia às 15:47 (horário de Brasília)
  workflow_dispatch:        # botão "Run workflow" para rodar na hora
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  atualizar:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Instalar dependências
        run: |
          pip install pillow
          npm install -g playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Baixar dados novos
        run: sh scripts/atualizar.sh
      - name: Salvar no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data.json site/photos.json site/status.json scripts/fotos/res.json
          git diff --cached --quiet || (git commit -m "Atualização automática dos dados" && git push)

  publicar:
    needs: atualizar
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
